[[bin]]
name = "s3f-axum"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { features = ["multipart"], version = "0.8" }
s3f = { path = "../../crates/core" }
serde = { features = ["derive"], version = "1" }
tempfile = "3"
tokio = { features = ["macros", "rt-multi-thread"], version = "1" }
utoipa = { features = ["axum_extras"], version = "5" }
utoipa-scalar = { features = ["axum"], version = "0.3" }

[package]
edition = "2021"
license = "MIT"
name = "s3f-axum-example"
publish = false
version = "0.1.0-rc.2"
authors = ["Lazypilottt"]

